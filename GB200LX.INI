; ==============================================================================
; GB200LX.INI - Game Boy Runtime Configuration for HP 200LX
; 16-Bit 80186 Static Recompiler Configuration
; ==============================================================================

[video]
; Viewport presentation:
;   center = Exact 160x144 Game Boy resolution centered on screen (x=80..239, y=28..171)
;   wide   = Horizontally stretched across 320 columns
scaling = center

; 4-Shade Grayscale Palette Preset on HP 200LX LCD:
;   pocket   = Clear Game Boy Pocket grayscale (White, Light Gray, Dark Gray, Black)
;   dmg      = Classic Game Boy DMG contrast
;   high_con = Maximum 2-shade high contrast
;   dark     = Inverted dark mode
palette = pocket

; Wait for Vertical Retrace (VSync) before rendering (1 = On, 0 = Off)
vsync = 1

[input]
; Keyboard Bindings (Named keys: UP, DOWN, LEFT, RIGHT, SPACE, ENTER, ESC, or A-Z):
key_up     = UP     ; D-Pad Up
key_down   = DOWN   ; D-Pad Down
key_left   = LEFT   ; D-Pad Left
key_right  = RIGHT  ; D-Pad Right
key_a      = Z      ; Button A
key_b      = X      ; Button B
key_select = SPACE  ; Select
key_start  = ENTER  ; Start
key_menu   = ESC    ; Exit to DOS
