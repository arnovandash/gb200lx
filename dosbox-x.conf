# HP 200LX emulation profile
# CPU: 80186-compatible "Hornet" @ 7.91 MHz
# RAM: 640KB conventional (rest of 1/2/4 MB used as silicon disk)
# Display: CGA 640x200 mono / 320x200 4-color
# OS: HP MS-DOS 5.0

[sdl]
output = surface

[cpu]
cputype = 80186
cycles  = fixed 7910

[dosbox]
machine = cga
memsize = 1

[dos]
dos mem limit = 640

[dos]
ver = 5.0

[render]
aspect = true
